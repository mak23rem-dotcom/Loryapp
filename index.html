<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LORY — Coming Soon</title>
  <meta name="description" content="LORY — AI travel audio guide that works offline. Coming soon." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ---------- Coming Soon Page ---------- */
    :root {
      --cs-bg: #0B0F1A;
      --cs-card: rgba(255,255,255,0.04);
      --cs-border: rgba(255,255,255,0.08);
      --cs-text: rgba(255,255,255,0.6);
    }

    body {
      background: var(--cs-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    /* Animated gradient orbs */
    .cs-bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      pointer-events: none;
      animation: orbFloat 8s ease-in-out infinite alternate;
    }
    .cs-bg-orb.orb-1 {
      width: 500px; height: 500px;
      background: var(--lory-blue);
      top: -10%; left: -5%;
    }
    .cs-bg-orb.orb-2 {
      width: 400px; height: 400px;
      background: var(--cheeky-red);
      bottom: -10%; right: -5%;
      animation-delay: -3s;
    }
    .cs-bg-orb.orb-3 {
      width: 300px; height: 300px;
      background: var(--sky-cyan);
      top: 50%; left: 60%;
      animation-delay: -5s;
    }
    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.08); }
    }

    /* Card */
    .cs-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: var(--cs-card);
      border: 1px solid var(--cs-border);
      border-radius: 24px;
      padding: 48px 36px 40px;
      backdrop-filter: blur(24px);
      text-align: center;
    }

    .cs-logo {
      height: 48px;
      width: auto;
      margin: 0 auto 8px;
    }

    .cs-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(24,255,109,0.08);
      border: 1px solid rgba(24,255,109,0.15);
      padding: 6px 16px;
      border-radius: 9999px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--jungle-green);
      margin-bottom: 28px;
    }
    .cs-badge .pulse-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--jungle-green);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    .cs-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.6rem, 4vw, 2rem);
      color: white;
      line-height: 1.2;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .cs-sub {
      font-size: 0.95rem;
      color: var(--cs-text);
      line-height: 1.6;
      margin-bottom: 36px;
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Form */
    .cs-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }

    .cs-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .cs-field input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--cs-border);
      background: rgba(255,255,255,0.04);
      color: white;
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .cs-field input::placeholder { color: rgba(255,255,255,0.25); }

    .cs-field input:focus {
      border-color: var(--sky-cyan);
      background: rgba(255,255,255,0.07);
    }

    .cs-btn {
      width: 100%;
      padding: 16px 32px;
      border-radius: 14px;
      border: none;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      margin-top: 4px;
    }

    .cs-btn-primary {
      background: var(--beak-orange);
      color: white;
      box-shadow: 0 4px 24px rgba(247,92,3,0.3);
    }
    .cs-btn-primary:hover {
      background: var(--beak-orange-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(247,92,3,0.4);
    }

    .cs-error {
      font-size: 0.82rem;
      color: var(--cheeky-red);
      text-align: center;
      min-height: 20px;
      margin-top: -4px;
    }

    /* Mascot peek */
    .cs-mascot {
      position: absolute;
      bottom: -48px;
      right: -16px;
      width: 90px;
      height: auto;
      animation: perchFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(48,102,190,0.3));
      pointer-events: none;
    }

    /* Footer link */
    .cs-footer {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      z-index: 2;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
    }
    .cs-footer a {
      color: var(--sky-cyan);
      transition: color 0.3s ease;
    }
    .cs-footer a:hover { color: white; }

    /* Stars / particles */
    .cs-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .cs-star {
      position: absolute;
      width: 2px; height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite alternate;
      opacity: 0;
    }
    @keyframes twinkle {
      0%   { opacity: 0; transform: scale(0.5); }
      100% { opacity: var(--op); transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Background effects -->
  <div class="cs-bg-orb orb-1"></div>
  <div class="cs-bg-orb orb-2"></div>
  <div class="cs-bg-orb orb-3"></div>
  <div class="cs-stars" id="cs-stars"></div>

  <!-- Login card -->
  <div class="cs-card">
    <img src="assets/lory-logo.png" alt="LORY" class="cs-logo" />

    <div class="cs-badge">
      <span class="pulse-dot"></span>
      Coming Soon
    </div>

    <h1 class="cs-title">Something amazing is flying your way</h1>
    <p class="cs-sub">LORY — your AI travel buddy. We're putting the finishing touches. Almost there.</p>

    <form class="cs-form" id="cs-form" autocomplete="off">
      <div class="cs-field">
        <label for="cs-user">Staff Access</label>
        <input type="text" id="cs-user" placeholder="Username" autocomplete="off" required />
      </div>
      <div class="cs-field">
        <label for="cs-pass">Password</label>
        <input type="password" id="cs-pass" placeholder="Password" autocomplete="off" required />
      </div>
      <div class="cs-error" id="cs-error"></div>
      <button type="submit" class="cs-btn cs-btn-primary">
        Take me to LORYapp <span style="font-size:1.1em;">→</span>
      </button>
    </form>

    <img src="assets/lory-mascot.png" alt="Lory" class="cs-mascot" />
  </div>

  <div class="cs-footer">
    Made by <a href="#">Sinequanon Labs</a> &middot; &copy; 2026
  </div>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      // If already authenticated, skip straight to the landing page
      if (LORY_AUTH.isAuthed()) {
        window.location.replace('lory.html');
        return;
      }

      // Generate star particles
      const stars = document.getElementById('cs-stars');
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'cs-star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top  = Math.random() * 100 + '%';
        s.style.setProperty('--dur', (2 + Math.random() * 3) + 's');
        s.style.setProperty('--op',  (0.2 + Math.random() * 0.5));
        s.style.animationDelay = (Math.random() * 4) + 's';
        stars.appendChild(s);
      }

      // Form handling
      const form  = document.getElementById('cs-form');
      const error = document.getElementById('cs-error');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        error.textContent = '';

        const user = document.getElementById('cs-user').value.trim();
        const pass = document.getElementById('cs-pass').value;

        if (!user || !pass) {
          error.textContent = 'Please enter both fields.';
          return;
        }

        if (LORY_AUTH.login(user, pass)) {
          window.location.href = 'lory.html';
        } else {
          error.textContent = 'Invalid credentials. Access denied.';
          document.getElementById('cs-pass').value = '';
          document.getElementById('cs-pass').focus();
          // Shake the card
          const card = document.querySelector('.cs-card');
          card.style.animation = 'shake 0.4s ease';
          setTimeout(function () { card.style.animation = ''; }, 500);
        }
      });
    })();
  </script>
</body>
</html>
